<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON DASH</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --neon-cyan: #00f5ff;
    --neon-pink: #ff0080;
    --neon-yellow: #ffee00;
    --dark: #050510;
    --mid: #0a0a2e;
    --glow-cyan: 0 0 10px #00f5ff, 0 0 30px #00f5ff44;
    --glow-pink: 0 0 10px #ff0080, 0 0 30px #ff008044;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--dark);
    font-family: 'Orbitron', monospace;
    touch-action: none;
  }

  #gameCanvas {
    display: block;
    margin: 0 auto;
    image-rendering: pixelated;
  }

  #ui {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  #hud {
    position: fixed; top: 16px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0 20px;
    pointer-events: none;
  }

  .hud-box {
    background: rgba(0,245,255,0.05);
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 4px;
    padding: 6px 14px;
    text-align: center;
  }

  .hud-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px; letter-spacing: 3px;
    color: rgba(0,245,255,0.5);
    text-transform: uppercase;
  }

  .hud-value {
    font-size: 22px; font-weight: 900;
    color: var(--neon-cyan);
    text-shadow: var(--glow-cyan);
    line-height: 1.1;
  }

  #screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #0a0a3e 0%, #050510 70%);
    z-index: 100;
  }

  #screen.hidden { display: none; }

  .screen-title {
    font-size: clamp(36px, 12vw, 72px);
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--neon-cyan);
    text-shadow: 0 0 20px #00f5ff, 0 0 60px #00f5ff88, 0 0 100px #00f5ff44;
    animation: pulse 2s ease-in-out infinite;
    text-align: center;
  }

  .screen-sub {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(12px, 4vw, 18px);
    letter-spacing: 4px;
    color: var(--neon-pink);
    text-shadow: var(--glow-pink);
    margin: 8px 0 40px;
    text-transform: uppercase;
    text-align: center;
  }

  .btn {
    font-family: 'Orbitron', monospace;
    font-size: clamp(12px, 3.5vw, 16px);
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 40px;
    background: transparent;
    border: 2px solid var(--neon-cyan);
    color: var(--neon-cyan);
    cursor: pointer;
    pointer-events: all;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    margin: 8px;
  }

  .btn::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--neon-cyan);
    transform: translateX(-100%);
    transition: transform 0.2s;
    z-index: -1;
  }

  .btn:hover::before, .btn:active::before { transform: translateX(0); }
  .btn:hover, .btn:active { color: var(--dark); text-shadow: none; }

  .btn-pink {
    border-color: var(--neon-pink);
    color: var(--neon-pink);
  }
  .btn-pink::before { background: var(--neon-pink); }

  #gameOver {
    text-align: center;
  }

  .go-score {
    font-size: clamp(48px, 16vw, 96px);
    font-weight: 900;
    color: white;
    text-shadow: var(--glow-cyan);
    line-height: 1;
    margin: 10px 0;
  }

  .go-best {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px; letter-spacing: 4px;
    color: var(--neon-yellow);
    text-shadow: 0 0 10px var(--neon-yellow);
    margin-bottom: 30px;
  }

  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 200;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
    );
  }

  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 199;
    background: radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,0.6) 100%);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }

  @keyframes slideIn {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .slide-in { animation: slideIn 0.4s ease forwards; }
  .slide-in-2 { animation: slideIn 0.4s 0.1s ease both; }
  .slide-in-3 { animation: slideIn 0.4s 0.2s ease both; }
  .slide-in-4 { animation: slideIn 0.4s 0.3s ease both; }

  #tapHint {
    position: fixed; bottom: 30px; left: 0; right: 0;
    text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px; letter-spacing: 4px;
    color: rgba(255,255,255,0.3);
    animation: pulse 1.5s infinite;
    pointer-events: none;
  }

  .star-field {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0;
  }

  #combo {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(28px, 8vw, 48px);
    font-weight: 900;
    color: var(--neon-yellow);
    text-shadow: 0 0 20px var(--neon-yellow);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 150;
  }
</style>
</head>
<body>

<canvas class="star-field" id="stars"></canvas>
<canvas id="gameCanvas"></canvas>

<div id="hud" style="display:none;">
  <div class="hud-box">
    <div class="hud-label">Score</div>
    <div class="hud-value" id="scoreDisplay">0</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Best</div>
    <div class="hud-value" id="bestDisplay">0</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Level</div>
    <div class="hud-value" id="levelDisplay">1</div>
  </div>
</div>

<div id="combo">COMBO x<span id="comboNum">2</span></div>

<div id="screen">
  <div class="screen-title slide-in">NEON DASH</div>
  <div class="screen-sub slide-in-2">Survive the grid</div>
  <button class="btn slide-in-3" id="startBtn">\u25b6 PLAY</button>
  <div style="font-family:'Rajdhani',sans-serif; color:rgba(0,245,255,0.3); font-size:12px; letter-spacing:3px; margin-top:20px;" class="slide-in-4">
    TAP / CLICK / SPACE TO JUMP
  </div>
</div>

<div id="gameOver" class="hidden" style="position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%, #0a0a3e 0%, #050510 70%);">
  <div style="font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:6px;color:var(--neon-pink);text-shadow:var(--glow-pink);margin-bottom:10px;" class="slide-in">GAME OVER</div>
  <div class="go-score slide-in-2" id="finalScore">0</div>
  <div class="go-best slide-in-3" id="bestMsg">BEST: 0</div>
  <div style="display:flex;gap:10px;" class="slide-in-4">
    <button class="btn" id="retryBtn">\u21ba RETRY</button>
    <button class="btn btn-pink" id="menuBtn">\u2302 MENU</button>
  </div>
</div>

<div class="scanlines"></div>
<div class="vignette"></div>
<div id="tapHint">TAP ANYWHERE TO JUMP</div>

<script>
// ====== STAR FIELD ======
const starsCanvas = document.getElementById('stars');
const sCtx = starsCanvas.getContext('2d');
let stars = [];

function initStars() {
  starsCanvas.width = window.innerWidth;
  starsCanvas.height = window.innerHeight;
  stars = Array.from({length: 120}, () => ({
    x: Math.random() * starsCanvas.width,
    y: Math.random() * starsCanvas.height,
    r: Math.random() * 1.5,
    speed: 0.2 + Math.random() * 1.5,
    opacity: Math.random()
  }));
}

function drawStars(speed = 1) {
  sCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
  stars.forEach(s => {
    s.x -= s.speed * speed;
    if (s.x < 0) { s.x = starsCanvas.width; s.y = Math.random() * starsCanvas.height; }
    sCtx.beginPath();
    sCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sCtx.fillStyle = `rgba(255,255,255,${s.opacity})`;
    sCtx.fill();
  });
}

// ====== GAME CORE ======
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H, scale;
const BASE_W = 400, BASE_H = 600;

function resize() {
  const ar = BASE_W / BASE_H;
  const winAr = window.innerWidth / window.innerHeight;
  if (winAr > ar) {
    H = Math.min(window.innerHeight, 700);
    W = H * ar;
  } else {
    W = Math.min(window.innerWidth, 420);
    H = W / ar;
  }
  scale = W / BASE_W;
  canvas.width = W;
  canvas.height = H;
  canvas.style.left = (window.innerWidth - W) / 2 + 'px';
  canvas.style.top = (window.innerHeight - H) / 2 + 'px';
  canvas.style.position = 'fixed';
  initStars();
}

// Game state
let state = 'menu'; // menu, playing, dead
let score = 0, best = parseInt(localStorage.getItem('neondash_best') || '0');
let frame = 0, level = 1, speed = 3.5;
let combo = 0, comboTimer = 0;
let particles = [];
let obstacles = [];
let collectibles = [];
let trails = [];
let flashAlpha = 0;

// Player
const P = {
  x: 80, y: 0, vy: 0,
  w: 28, h: 28,
  grounded: false,
  jumps: 0, maxJumps: 2,
  color: '#00f5ff',
  rotation: 0,
  squash: 1, squashV: 0,
  shield: 0
};

const GROUND_Y = BASE_H - 80;
const GRAVITY = 0.55;
const JUMP_FORCE = -13;

function resetPlayer() {
  P.y = GROUND_Y - P.h;
  P.vy = 0; P.grounded = true;
  P.jumps = 0; P.rotation = 0;
  P.squash = 1; P.squashV = 0;
  P.shield = 0;
}

function jump() {
  if (state !== 'playing') return;
  if (P.jumps < P.maxJumps) {
    P.vy = JUMP_FORCE * (P.jumps === 1 ? 0.85 : 1);
    P.jumps++;
    P.grounded = false;
    P.squash = 0.6;
    spawnJumpParticles();
    combo++;
    comboTimer = 90;
    updateCombo();
  }
}

function spawnJumpParticles() {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: P.x + P.w/2, y: P.y + P.h,
      vx: (Math.random()-0.5)*3, vy: Math.random()*2+1,
      life: 30+Math.random()*20,
      maxLife: 50,
      color: P.jumps > 1 ? '#ff0080' : '#00f5ff',
      size: 2+Math.random()*2
    });
  }
}

function spawnDeathParticles() {
  for (let i = 0; i < 30; i++) {
    const angle = (Math.PI*2/30)*i + Math.random()*0.3;
    const spd = 3+Math.random()*5;
    particles.push({
      x: P.x+P.w/2, y: P.y+P.h/2,
      vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
      life: 50+Math.random()*30, maxLife: 80,
      color: ['#ff0080','#00f5ff','#ffee00'][Math.floor(Math.random()*3)],
      size: 3+Math.random()*4, gravity: 0.15
    });
  }
}

function spawnCollectParticles(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const angle = Math.random()*Math.PI*2;
    particles.push({
      x, y,
      vx: Math.cos(angle)*(1+Math.random()*3),
      vy: Math.sin(angle)*(1+Math.random()*3),
      life: 25+Math.random()*15, maxLife: 40,
      color, size: 2+Math.random()*3
    });
  }
}

// Obstacles
const OBS_TYPES = [
  { w: 24, h: 50, color: '#ff0080' },
  { w: 16, h: 80, color: '#ff4444' },
  { w: 44, h: 28, color: '#ff0080' },
  { w: 20, h: 36, color: '#ff6622' },
];

function spawnObstacle() {
  const t = OBS_TYPES[Math.floor(Math.random()*OBS_TYPES.length)];
  let h = t.h + Math.random()*20;
  let stackCount = Math.random() < 0.2 ? 2 : 1;
  
  // Flying obstacle
  if (level >= 3 && Math.random() < 0.25) {
    obstacles.push({
      x: BASE_W + 20, y: GROUND_Y - 120 - Math.random()*80,
      w: t.w, h: t.h * 0.8,
      color: '#ff44aa', flying: true,
      wobble: Math.random()*Math.PI*2
    });
    return;
  }

  for (let i = 0; i < stackCount; i++) {
    obstacles.push({
      x: BASE_W + 20 + i * (t.w + 5),
      y: GROUND_Y - h,
      w: t.w, h,
      color: t.color,
      flying: false
    });
  }
}

function spawnCollectible() {
  const isShield = Math.random() < 0.1;
  collectibles.push({
    x: BASE_W + 20,
    y: GROUND_Y - 100 - Math.random()*120,
    r: 10, 
    color: isShield ? '#ffee00' : '#00f5ff',
    shield: isShield,
    pulse: Math.random()*Math.PI*2,
    collected: false
  });
}

// Score display
function updateHUD() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('bestDisplay').textContent = best;
  document.getElementById('levelDisplay').textContent = level;
}

function updateCombo() {
  if (combo >= 2) {
    const el = document.getElementById('combo');
    document.getElementById('comboNum').textContent = combo;
    el.style.opacity = '1';
    el.style.transform = 'translate(-50%,-50%) scale(1.2)';
    setTimeout(() => el.style.transform = 'translate(-50%,-50%) scale(1)', 100);
  }
}

// Drawing helpers
function drawGlowRect(x, y, w, h, color, glowSize=12, alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color;
  ctx.shadowBlur = glowSize;
  ctx.fillStyle = color;
  ctx.fillRect(x*scale, y*scale, w*scale, h*scale);
  ctx.restore();
}

function drawGlowCircle(x, y, r, color, glowSize=10) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = glowSize;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x*scale, y*scale, r*scale, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// Main game loop
let lastObs = 0, lastCollect = 0;
let obsInterval = 90, collectInterval = 180;

function gameLoop() {
  requestAnimationFrame(gameLoop);
  
  const spd = state === 'playing' ? speed : 0.5;
  drawStars(spd/3.5);
  
  ctx.clearRect(0, 0, W, H);
  
  // Background grid
  drawGrid();
  
  if (state === 'playing') {
    frame++;
    score = Math.floor(frame / 4);
    if (score > best) { best = score; localStorage.setItem('neondash_best', best); }
    
    // Level up
    level = 1 + Math.floor(score / 200);
    speed = 3.5 + level * 0.4;
    obsInterval = Math.max(45, 90 - level * 5);
    
    updateHUD();
    
    // Spawn
    if (frame - lastObs > obsInterval + Math.random()*30) {
      spawnObstacle(); lastObs = frame;
    }
    if (frame - lastCollect > collectInterval + Math.random()*60) {
      spawnCollectible(); lastCollect = frame;
    }

    // Player physics
    P.vy += GRAVITY;
    P.y += P.vy;
    if (P.y >= GROUND_Y - P.h) {
      P.y = GROUND_Y - P.h;
      P.vy = 0; P.grounded = true; P.jumps = 0;
      if (!P.grounded) { P.squash = 0.7; }
    }
    P.rotation += P.grounded ? 0 : 0.08;

    // Squash spring
    P.squashV += (1 - P.squash) * 0.3;
    P.squashV *= 0.7;
    P.squash += P.squashV;

    // Combo timer
    if (comboTimer > 0) {
      comboTimer--;
      if (comboTimer === 0) {
        combo = 0;
        document.getElementById('combo').style.opacity = '0';
      }
    }

    // Trails
    trails.push({ x: P.x + P.w/2, y: P.y + P.h/2, age: 0 });
    if (trails.length > 15) trails.shift();

    // Move obstacles
    obstacles.forEach(o => {
      o.x -= speed;
      if (o.flying) o.y += Math.sin(frame*0.05 + o.wobble) * 0.8;
    });
    obstacles = obstacles.filter(o => o.x > -50);

    // Move collectibles
    collectibles.forEach(c => {
      c.x -= speed; c.pulse += 0.1;
    });
    collectibles = collectibles.filter(c => c.x > -30 && !c.collected);

    // Collision: obstacles
    for (const o of obstacles) {
      if (rectsOverlap(P.x+3, P.y+3, P.w-6, P.h-6, o.x, o.y, o.w, o.h)) {
        if (P.shield > 0) {
          P.shield = 0; obstacles = obstacles.filter(x=>x!==o);
          spawnCollectParticles(o.x+o.w/2, o.y+o.h/2, '#ffee00');
          flashAlpha = 0.5;
        } else {
          die(); return;
        }
      }
    }

    // Collision: collectibles
    for (const c of collectibles) {
      if (!c.collected && circleRectOverlap(c.x, c.y, c.r, P.x, P.y, P.w, P.h)) {
        c.collected = true;
        score += 50;
        if (c.shield) P.shield = 300;
        spawnCollectParticles(c.x, c.y, c.color);
        flashAlpha = 0.2;
      }
    }

    if (flashAlpha > 0) { flashAlpha -= 0.03; }
    if (P.shield > 0) P.shield--;
  }

  // Draw everything
  drawTrails();
  drawObstacles();
  drawCollectibles();
  drawPlayer();
  drawGround();
  drawParticles();

  // Flash
  if (flashAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

function die() {
  if (state !== 'playing') return;
  state = 'dead';
  spawnDeathParticles();
  flashAlpha = 0.8;
  setTimeout(showGameOver, 800);
}

function rectsOverlap(x1,y1,w1,h1,x2,y2,w2,h2) {
  return x1<x2+w2 && x1+w1>x2 && y1<y2+h2 && y1+h1>y2;
}
function circleRectOverlap(cx,cy,cr,rx,ry,rw,rh) {
  const nearX = Math.max(rx, Math.min(cx, rx+rw));
  const nearY = Math.max(ry, Math.min(cy, ry+rh));
  const dx = cx - nearX, dy = cy - nearY;
  return dx*dx + dy*dy < cr*cr;
}

function drawGrid() {
  ctx.save();
  ctx.strokeStyle = 'rgba(0,245,255,0.05)';
  ctx.lineWidth = 1;
  const gridSize = 40 * scale;
  const offset = (frame * speed * scale * 0.3) % gridSize;
  for (let x = -offset; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}

function drawGround() {
  // Ground line
  ctx.save();
  ctx.shadowColor = '#00f5ff';
  ctx.shadowBlur = 15;
  ctx.strokeStyle = '#00f5ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y * scale);
  ctx.lineTo(W, GROUND_Y * scale);
  ctx.stroke();

  // Ground glow
  const grad = ctx.createLinearGradient(0, GROUND_Y*scale, 0, H);
  grad.addColorStop(0, 'rgba(0,245,255,0.08)');
  grad.addColorStop(1, 'rgba(0,245,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, GROUND_Y*scale, W, H - GROUND_Y*scale);
  ctx.restore();
}

function drawTrails() {
  trails.forEach((t, i) => {
    const alpha = (i / trails.length) * 0.4;
    const size = (i / trails.length) * (P.w * 0.5);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = '#00f5ff';
    ctx.shadowBlur = 5;
    ctx.fillStyle = '#00f5ff';
    ctx.beginPath();
    ctx.arc(t.x*scale, t.y*scale, size*scale/2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

function drawPlayer() {
  ctx.save();
  const cx = (P.x + P.w/2) * scale;
  const cy = (P.y + P.h/2) * scale;
  const hw = (P.w/2 * P.squash) * scale;
  const hh = (P.h/2 / Math.max(0.5, P.squash)) * scale;

  ctx.translate(cx, cy);
  if (!P.grounded) ctx.rotate(P.rotation);

  // Shield ring
  if (P.shield > 0) {
    ctx.save();
    ctx.strokeStyle = '#ffee00';
    ctx.shadowColor = '#ffee00';
    ctx.shadowBlur = 20;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.5 + Math.sin(frame*0.2)*0.3;
    ctx.beginPath();
    ctx.arc(0, 0, hw * 1.5, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // Glow
  ctx.shadowColor = '#00f5ff';
  ctx.shadowBlur = 20;

  // Body
  ctx.fillStyle = '#00f5ff';
  ctx.fillRect(-hw, -hh, hw*2, hh*2);

  // Inner bright
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(-hw*0.4, -hh*0.4, hw*0.8, hh*0.8);

  // Edge lines
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1;
  ctx.strokeRect(-hw, -hh, hw*2, hh*2);

  ctx.restore();
}

function drawObstacles() {
  obstacles.forEach(o => {
    ctx.save();
    ctx.shadowColor = o.color;
    ctx.shadowBlur = 15;

    // Body
    ctx.fillStyle = o.color;
    ctx.fillRect(o.x*scale, o.y*scale, o.w*scale, o.h*scale);

    // Stripe
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    for (let y = 0; y < o.h; y += 12) {
      ctx.fillRect(o.x*scale, (o.y+y)*scale, o.w*scale, 6*scale);
    }

    // Top glow cap
    const grad = ctx.createLinearGradient(0, o.y*scale, 0, (o.y+10)*scale);
    grad.addColorStop(0, 'rgba(255,255,255,0.6)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(o.x*scale, o.y*scale, o.w*scale, 10*scale);

    if (o.flying) {
      ctx.strokeStyle = o.color;
      ctx.lineWidth = 1;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.moveTo((o.x+o.w/2)*scale, (o.y+o.h)*scale);
      ctx.lineTo((o.x+o.w/2)*scale, GROUND_Y*scale);
      ctx.stroke();
    }

    ctx.restore();
  });
}

function drawCollectibles() {
  collectibles.forEach(c => {
    if (c.collected) return;
    ctx.save();
    const pulse = Math.sin(c.pulse) * 0.3 + 1;
    ctx.shadowColor = c.color;
    ctx.shadowBlur = 15 * pulse;
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(c.x*scale, c.y*scale, c.r*scale*pulse, 0, Math.PI*2);
    ctx.fill();

    if (c.shield) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(c.x*scale, c.y*scale, (c.r+3)*scale*pulse, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.gravity) p.vy += p.gravity;
    p.life--;
    const alpha = p.life / p.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x*scale, p.y*scale, p.size*scale/2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
  particles = particles.filter(p => p.life > 0);
}
